<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Would You Be My Baby 💗</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden; 
      font-family: "Tahoma", "Noto Sans Thai", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #fff7f8 0 8%, transparent 9%),
        radial-gradient(circle at 80% 15%, #ffeef2 0 10%, transparent 11%),
        linear-gradient(135deg, #ffe7ec, #fff4f6);
      color: #8a3b4b;
    }

    /* ==========================================
       สไตล์สำหรับแอนิเมชันซองจดหมาย (หน้าแรก)
       ========================================== */
    .envelope-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, #fff7f8 0 8%, transparent 9%),
        radial-gradient(circle at 80% 15%, #ffeef2 0 10%, transparent 11%),
        linear-gradient(135deg, #ffe7ec, #fff4f6);
      z-index: 99999; 
      transition: opacity 0.8s ease, visibility 0.8s ease, transform 0.8s ease;
    }
    
    .envelope-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.2); 
    }

    .envelope {
      position: relative;
      width: 260px; height: 160px;
      cursor: pointer;
      transition: transform 0.3s ease;
      margin-top: 40px;
    }
    .envelope:hover {
      transform: translateY(-5px);
    }
    
    .envelope-back {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #eec2cd;
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(170, 88, 108, 0.2);
    }
    
    .flap {
      position: absolute; top: 0; left: 0;
      width: 0; height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 90px solid #e5a4b5;
      transform-origin: top;
      transition: transform 0.6s ease, z-index 0.2s;
      z-index: 4;
    }
    
    .env-body {
      position: absolute; bottom: 0; left: 0;
      width: 0; height: 0;
      border-left: 130px solid #f3ccd5;
      border-right: 130px solid #f3ccd5;
      border-bottom: 95px solid #f1d8df;
      z-index: 3;
      border-radius: 0 0 8px 8px;
    }
    
    .heart-seal {
      position: absolute; top: 85px; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      z-index: 5;
      transition: opacity 0.3s ease;
    }
    
    .letter {
      position: absolute; bottom: 5px; left: 10px;
      width: 240px; height: 140px;
      background: white;
      border-radius: 8px;
      z-index: 2;
      transition: transform 0.8s ease 0.4s; 
      display: grid;
      place-items: center;
      font-size: 40px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1; 
    }
    .envelope.open .heart-seal {
      opacity: 0;
    }
    .envelope.open .letter {
      transform: translateY(-90px);
    }

    .click-text {
      margin-top: 60px;
      font-size: 20px; color: #e54262; font-weight: bold; text-align: center;
      line-height: 1.4;
      animation: pulse 2s infinite;
      transition: opacity 0.3s;
    }
    .click-text small {
      font-size: 15px; color: #bd8b97; font-weight: normal;
    }

    /* ==========================================
       สไตล์ของการ์ดหลัก (หน้าคำถาม)
       ========================================== */
    .card {
      width: min(92vw, 560px);
      padding: 42px 26px 34px;
      text-align: center;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(170, 88, 108, .16);
      backdrop-filter: blur(8px);
      position: relative;
      z-index: 10;
    }

    .hearts span {
      position: absolute;
      font-size: 18px;
      color: #ff8aa4;
      animation: float 3s ease-in-out infinite;
      user-select: none;
    }
    .hearts span:nth-child(1){left:12%;top:16%;animation-delay:.1s}
    .hearts span:nth-child(2){right:14%;top:20%;animation-delay:.6s}
    .hearts span:nth-child(3){left:18%;bottom:24%;animation-delay:1.2s}
    .hearts span:nth-child(4){right:18%;bottom:19%;animation-delay:1.7s}

    @keyframes float {
      0%,100% { transform: translateY(0) scale(1); opacity:.65 }
      50% { transform: translateY(-10px) scale(1.12); opacity:1 }
    }

    .img-wrap {
      width: 180px;
      margin: 0 auto 15px;
    }
    .img-wrap img {
      width: 100%;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(170, 88, 108, 0.15);
      display: block;
      transition: opacity 0.2s ease-in-out; 
    }

    h1 {
      margin: 8px 0 10px;
      color: #e54262;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.25;
    }

    .buttons {
      height: 70px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 25px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease-out;
    }

    #yesBtn {
      background: #ff8da7;
      color: #fff;
      box-shadow: 0 8px 18px rgba(255, 141, 167, .35);
      z-index: 12;
    }
    #yesBtn:hover {
      box-shadow: 0 11px 22px rgba(255, 141, 167, .45);
    }

    #noBtn {
      background: #fff;
      color: #9a7b82;
      border: 1px solid #f1d8df;
      position: relative;
      z-index: 9999;
    }

    .success {
      display: none;
      animation: pop .45s ease both;
    }

    @keyframes pop {
      from { transform: scale(.86); opacity:0; }
      to { transform: scale(1); opacity:1; }
    }

    .success h2 {
      margin: 0 0 8px;
      color: #e54262;
      font-size: clamp(24px, 5vw, 34px);
    }

    .music-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 46px;
      height: 46px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      color: #e54262;
      border: 1px solid #f3ccd5;
      box-shadow: 0 8px 20px rgba(170, 88, 108, .14);
      z-index: 100000; 
      font-size: 20px;
    }

    .floating-bubble {
      position: fixed;
      background: #ffffff;
      color: #e54262;
      padding: 8px 20px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
      z-index: 5;
      pointer-events: none;
      white-space: nowrap;
      user-select: none;
      opacity: 0; 
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>
  
  <!-- แก้ปัญหาไฟล์ .mp4 บนมือถือ โดยใช้แท็ก video แบบซ่อนแทน audio -->
  <video id="bgMusic" src="PROXIE.mp4" loop playsinline style="display: none;"></video>
  
  <button class="music-btn" id="musicBtn" aria-label="เปิดหรือปิดเพลง" title="เปิด/ปิดเพลง">♪</button>

  <!-- ฉากซองจดหมาย -->
  <div id="envelopeScreen" class="envelope-screen">
    <div class="envelope" id="envelopeBtn">
      <div class="envelope-back"></div>
      <div class="letter">💕</div>
      <div class="flap"></div>
      <div class="env-body"></div>
      <div class="heart-seal">❤️</div>
    </div>
    <p class="click-text" id="clickText">มีจดหมายส่งถึงเธอ 💌<br><small>(แตะเพื่อเปิดซอง)</small></p>
  </div>

  <!-- การ์ดหลัก -->
  <main class="card" id="card">
    <div class="hearts" aria-hidden="true">
      <span>♡</span><span>♡</span><span>♡</span><span>♡</span>
    </div>

    <!-- ส่วนคำถาม -->
    <section id="question">
      <div class="img-wrap" aria-hidden="true">
        <img id="reactionImg" src="wait.jpg" alt="รอคำตอบ">
      </div>

      <h1>Would You Be My Baby 💗</h1>

      <div class="buttons" id="buttonArea">
        <button id="yesBtn">Yeahhh! 💕</button>
        <button id="noBtn">Nuh-uhhh 🥺😭</button>
      </div>
    </section>

    <!-- ส่วนตอบตกลง -->
    <section class="success" id="success">
      <div class="img-wrap" aria-hidden="true">
        <img src="happy.jpg" alt="เย้!">
      </div>
      <h2>ขอโทษที่ให้รอนานนะ</h2>
      <h2>รักนะค้าบบบ💗</h2>
    </section>
  </main>

  <script>
    const envelopeBtn = document.getElementById('envelopeBtn');
    const envelopeScreen = document.getElementById('envelopeScreen');
    const clickText = document.getElementById('clickText');

    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const question = document.getElementById('question');
    const success = document.getElementById('success');
    const musicBtn = document.getElementById('musicBtn');
    const bgMusic = document.getElementById('bgMusic');
    const reactionImg = document.getElementById('reactionImg');

    let noCount = 0;
    let isMusicPlaying = false;
    let userHasInteracted = false;
    
    const waitImages = ['wait.jpg', 'wait1.jpg', 'wait2.jpg'];
    let currentImgIndex = 0;

    // ระบบเปิดซองจดหมาย
    envelopeBtn.addEventListener('click', () => {
      startMusic();
      envelopeBtn.classList.add('open');
      clickText.style.opacity = '0';

      const emojis = ['💖', '💕', '💗', '✨', '💌'];
      for (let i = 0; i < 60; i++) {
        const particle = document.createElement('div');
        particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        particle.style.position = 'fixed';
        particle.style.left = '50%';
        particle.style.top = '50%';
        particle.style.fontSize = (16 + Math.random() * 24) + 'px';
        particle.style.pointerEvents = 'none';
        particle.style.zIndex = 100000;
        document.body.appendChild(particle);

        const tx = (Math.random() - 0.5) * 150; 
        const ty = (Math.random() - 0.5) * 150; 
        const duration = 1000 + Math.random() * 1500;

        particle.animate([
          { transform: `translate(-50%, -50%) scale(0.2) rotate(0deg)`, opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}vw), calc(-50% + ${ty}vh)) scale(1.5) rotate(${Math.random() * 360}deg)`, opacity: 0 }
        ], {
          duration: duration,
          easing: 'cubic-bezier(0, .9, .5, 1)', 
          fill: 'forwards'
        });

        setTimeout(() => particle.remove(), duration);
      }
      
      setTimeout(() => {
        envelopeScreen.classList.add('fade-out');
      }, 1600); 
    }, { once: true });

    // ระบบปุ่มหนี
    function moveNoButton() {
      noBtn.textContent = 'No Way!! 😝';

      currentImgIndex = (currentImgIndex + 1) % waitImages.length;
      reactionImg.src = waitImages[currentImgIndex];

      if (noBtn.parentNode !== document.body) {
        document.body.appendChild(noBtn);
        noBtn.style.position = 'fixed';
      }

      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      const vWidth = window.innerWidth;
      const vHeight = window.innerHeight;
      const padding = 20;
      const maxX = vWidth - btnWidth - padding;
      const maxY = vHeight - btnHeight - padding;

      let x, y;
      let tries = 0;

      do {
        x = padding + Math.random() * (maxX - padding);
        y = padding + Math.random() * (maxY - padding);
        tries++;

        const yesRect = yesBtn.getBoundingClientRect();
        const overlapsYes =
          x < yesRect.right + 20 &&
          x + btnWidth > yesRect.left - 20 &&
          y < yesRect.bottom + 20 &&
          y + btnHeight > yesRect.top - 20;

        if (!overlapsYes) break;
      } while (tries < 30);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      noCount++;
      const yesScale = Math.min(1.8, 1 + noCount * 0.1);
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    ['mouseenter', 'pointerdown', 'touchstart', 'click'].forEach(evt => {
      noBtn.addEventListener(evt, (e) => {
        e.preventDefault();
        moveNoButton();
      }, { passive: false });
    });

    // ระบบตอบตกลง
    yesBtn.addEventListener('click', () => {
      startMusic();
      noBtn.style.display = 'none';
      question.style.display = 'none';
      success.style.display = 'block';

      const words = ['OK', 'รักค้าบ ❤', 'ยอม', 'Yes!', 'ตกลง'];
      
      for (let i = 0; i < 40; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'floating-bubble';
        bubble.textContent = words[Math.floor(Math.random() * words.length)];
        
        const finalX = -5 + Math.random() * 95; 
        const finalY = 5 + Math.random() * 85; 
        const rotate = (Math.random() - 0.5) * 50; 
        
        bubble.style.left = finalX + 'vw';
        document.body.appendChild(bubble);

        const duration = 1500 + Math.random() * 2500; 
        const delay = Math.random() * 2000; 

        bubble.animate([
          { top: '110vh', opacity: 0, transform: `rotate(${rotate}deg) scale(0.6)` },
          { top: finalY + 'vh', opacity: 1, transform: `rotate(${rotate}deg) scale(1)` }
        ], {
          duration: duration,
          delay: delay,
          easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', 
          fill: 'forwards' 
        });
      }
    });

    // ระบบเล่นเพลง
    function startMusic() {
      if (!isMusicPlaying) {
        bgMusic.play().then(() => {
          isMusicPlaying = true;
          musicBtn.textContent = '♫';
          musicBtn.title = 'ปิดเพลง';
        }).catch((err) => {
          console.log("รอการตอบสนองจากผู้ใช้ก่อนเล่นเพลง / หรืออาจระบุชื่อไฟล์ผิด: ", err);
        });
      }
      userHasInteracted = true;
    }

    function stopMusic() {
      bgMusic.pause();
      isMusicPlaying = false;
      musicBtn.textContent = '♪';
      musicBtn.title = 'เปิดเพลง';
    }

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isMusicPlaying) {
        stopMusic();
      } else {
        startMusic();
      }
    });

  </script>
</body>
</html>
